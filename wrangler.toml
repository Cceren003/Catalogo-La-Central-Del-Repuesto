# Cloudflare Pages — bindings para Pages Functions
# Más info: https://developers.cloudflare.com/pages/functions/bindings/

name = "lacentraldelrepuesto"
compatibility_date = "2026-11-21"
pages_build_output_dir = "."

# ═══════════════════════════════════════════
# D1 — base de datos SQLite para auth + access log
# ═══════════════════════════════════════════
# Creada el 2026-11-21 con `wrangler d1 create lcr-auth`.
# Binding name "DB" coincide con env.DB usado en functions/_lib/db.js.

[[d1_databases]]
binding = "DB"
database_name = "lcr-auth"
database_id = "8ae0f364-3e8c-45c5-bcd9-359c0de692e9"
